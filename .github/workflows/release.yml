name: release
on:
  release:
    types: [released]
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - run: make test
      - run: scripts/package-macos.sh "${GITHUB_REF_NAME#v}" "${{ github.repository }}"
      - run: gh release upload "$GITHUB_REF_NAME" "dist/model-bridge-${GITHUB_REF_NAME#v}-macos.dmg" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          (cd core && go test ./...)
          dotnet test --solution windows/ModelBridge.sln
          scripts/package-windows.sh "$VERSION" "${{ github.repository }}"
          gh release upload "$GITHUB_REF_NAME" "dist/model-bridge-$VERSION-windows-setup.exe" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
  cleanup:
    runs-on: ubuntu-latest
    needs: [macos, windows]
    if: ${{ failure() || cancelled() }}
    steps:
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release delete-asset "$GITHUB_REF_NAME" "model-bridge-$VERSION-macos.dmg" --yes --repo "${{ github.repository }}" || true
          gh release delete-asset "$GITHUB_REF_NAME" "model-bridge-$VERSION-windows-setup.exe" --yes --repo "${{ github.repository }}" || true
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
