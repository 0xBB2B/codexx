name: pages
on:
  push:
    paths:
      - 'site/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    timeout-minutes: 10
    # push 的过滤条件写不了"默认分支"这个动态值，所以在这里比对；手动触发放行，由第一步判断并明确失败
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Require default branch
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "只能在默认分支上发布官网" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: scripts/sitecheck/go.mod
          cache: false
      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if OUT="$(gh api "repos/${{ github.repository }}/releases/latest" -q .tag_name 2>&1)"; then
            VER="${OUT#v}"
          elif [[ "$OUT" == *"HTTP 404"* ]]; then
            VER=""
          else
            echo "$OUT" >&2
            exit 1
          fi
          cd scripts/sitebuild
          go run . ../../site ../../_site "$VER"
      - name: Check site
        working-directory: scripts/sitecheck
        run: go run . ../../_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    timeout-minutes: 10
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
